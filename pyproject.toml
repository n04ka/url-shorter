[project]
name = "url-shorter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-cache2[redis]==0.2.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "setuptools>=84.0.0",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.0",
]

[project.scripts]
dev = "url_shorter.main:run"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

